name: Deploy to GitHub + Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/my-site run build
        env:
          PORT: '19578'
          BASE_PATH: '/'
          NODE_ENV: production

      - name: Prepare Vercel output
        run: |
          mkdir -p artifacts/my-site/.vercel/output/static
          cat > artifacts/my-site/.vercel/project.json << 'EOF'
          {"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}
          EOF
          cat > artifacts/my-site/.vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "src": "/static/(.*)", "headers": { "cache-control": "public, max-age=31536000, immutable" }, "continue": true },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          cp -r artifacts/my-site/dist/. artifacts/my-site/.vercel/output/static/

      - name: Deploy to Vercel (production)
        run: |
          npx vercel@latest deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
        working-directory: artifacts/my-site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
